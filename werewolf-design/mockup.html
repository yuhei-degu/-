<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI人狼 観戦画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --panel-2:#f0ebe0; --line:#e2dccf;
  --ink:#1f1c17; --ink-2:#5f5a50; --ink-3:#958e80;
  --village:#2f7d5b; --village-soft:#dcefe5;
  --wolf:#c2413a; --wolf-soft:#f7dedb;
  --accent:#b8862b; --accent-soft:#f5e9cf;
  --night:#28305a;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12141c; --panel:#1a1d28; --panel-2:#222635; --line:#2e3345;
    --ink:#ece8df; --ink-2:#b3ad9f; --ink-3:#7d786d;
    --village:#5cc497; --village-soft:#1d3a2f;
    --wolf:#f07068; --wolf-soft:#45211f;
    --accent:#e2b35a; --accent-soft:#3b3020;
    --night:#8f9ae0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#12141c; --panel:#1a1d28; --panel-2:#222635; --line:#2e3345;
  --ink:#ece8df; --ink-2:#b3ad9f; --ink-3:#7d786d;
  --village:#5cc497; --village-soft:#1d3a2f;
  --wolf:#f07068; --wolf-soft:#45211f;
  --accent:#e2b35a; --accent-soft:#3b3020;
  --night:#8f9ae0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}

.app{max-width:1200px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px;min-height:100%}

/* ---------- header ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:22px;font-weight:900;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--ink-3);letter-spacing:.08em}
.controls{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

/* ---------- phase stepper ---------- */
.stepper{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;overflow-x:auto;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.step{flex:1 0 auto;text-align:center;font-size:12px;font-weight:500;color:var(--ink-3);padding:6px 10px;border-radius:9px;white-space:nowrap;transition:all .3s}
.step.done{color:var(--ink-2)}
.step.now{background:var(--ink);color:var(--bg);font-weight:700}
.step.now.night{background:var(--night);color:#fff}

/* ---------- layout ---------- */
.main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
.main>.panel:first-child{position:sticky;top:16px}
@media (max-width:820px){.main>.panel:first-child{position:static}}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0}
.panel-head h2{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.1em}
.panel-head small{font-size:12px;color:var(--ink-3)}

/* ---------- players ---------- */
.players{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}
@media (max-width:820px){.players{grid-template-columns:repeat(3,1fr)}}
@media (max-width:460px){.players{grid-template-columns:repeat(2,1fr)}}
.card{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);transition:border-color .25s,transform .25s,opacity .4s,box-shadow .25s}
.card.speaking{border-color:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 18%,transparent);transform:translateY(-2px)}
.card.dead{opacity:.45}
.card.dead .avatar{filter:grayscale(1)}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-weight:900;font-size:17px}
.card .meta{min-width:0;flex:1}
.card .name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.card .sub{font-size:11px;color:var(--ink-3);display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;line-height:1.6;white-space:nowrap}
.tag.claim{background:var(--accent-soft);color:var(--accent)}
.tag.role-v{background:var(--village-soft);color:var(--village)}
.tag.role-w{background:var(--wolf-soft);color:var(--wolf)}
.tag.voted{background:var(--panel-2);color:var(--ink-2)}
.tag.exec{background:var(--wolf);color:#fff}
.role{display:none}
body.show-roles .role{display:inline-block}
.votes-in{position:absolute;top:-8px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--wolf);color:#fff;font-weight:900;font-size:13px;display:none;place-items:center;padding:0 6px;box-shadow:var(--shadow)}
.votes-in.on{display:grid;animation:pop .35s ease}

.legend{padding:0 18px 16px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.legend b{font-weight:700;color:var(--ink-2)}

/* ---------- plaza (log) ---------- */
.plaza{display:flex;flex-direction:column;min-height:420px;max-height:calc(100vh - 190px)}
@media (max-width:820px){.plaza{max-height:none;min-height:0}}
.log{flex:1;overflow-y:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
@media (max-width:820px){.log{max-height:60vh}}
.msg{display:flex;gap:10px;align-items:flex-start;animation:rise .35s ease}
.msg .avatar{width:32px;height:32px;font-size:14px}
.bubble{background:var(--panel-2);border-radius:4px 14px 14px 14px;padding:8px 12px;max-width:100%}
.bubble .who{font-size:12px;font-weight:700;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.bubble .who em{font-style:normal;font-weight:500;color:var(--ink-3)}
.bubble p{font-size:14.5px}
.result{display:inline-flex;align-items:center;gap:4px;font-weight:700;padding:0 6px;border-radius:6px}
.result.w{background:var(--wolf-soft);color:var(--wolf)}
.result.h{background:var(--village-soft);color:var(--village)}
.sys{align-self:center;text-align:center;font-size:12.5px;color:var(--ink-2);background:var(--panel);border:1px dashed var(--line);border-radius:999px;padding:4px 14px;animation:rise .35s ease}
.sys.night{color:var(--night);border-color:color-mix(in srgb,var(--night) 40%,transparent)}
.round{align-self:stretch;display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink-3);margin-top:6px}
.round::before,.round::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- vote tally ---------- */
.tally{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;animation:rise .35s ease}
.tally h3{font-size:12px;letter-spacing:.12em;color:var(--ink-2);margin-bottom:8px}
.tally-row{display:grid;grid-template-columns:64px 1fr 24px;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.bar{height:12px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--wolf);border-radius:6px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.tally-row.low .bar i{background:var(--ink-3)}
.arrows{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.arrow{font-size:12px;background:var(--panel-2);border-radius:999px;padding:2px 10px;color:var(--ink-2)}

/* ---------- win banner ---------- */
.banner{position:fixed;inset:0;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);z-index:10;padding:16px}
.banner.on{display:grid;animation:fade .4s ease}
.banner-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px 28px 22px;text-align:center;max-width:420px;width:100%}
.banner-card .kicker{font-size:12px;letter-spacing:.2em;color:var(--ink-3)}
.banner-card h2{font-size:32px;font-weight:900;color:var(--village);margin:4px 0 6px}
.banner-card p{font-size:14px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stats div{background:var(--panel-2);border-radius:12px;padding:8px}
.stats b{display:block;font-size:22px;font-weight:900}
.stats span{font-size:11px;color:var(--ink-3)}
.reveal{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:18px}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>AI人狼</h1><span>観戦モード · 6人 · 議論3周</span></div>
    <div class="controls">
      <button class="btn primary" id="play">⏸ 一時停止</button>
      <button class="btn" id="speed">速度 1×</button>
      <button class="btn" id="roles" aria-pressed="false">役職を表示</button>
      <button class="btn" id="restart">↺ 最初から</button>
    </div>
  </header>

  <nav class="stepper" id="stepper"></nav>

  <div class="main">
    <section class="panel">
      <div class="panel-head"><h2>参加者</h2><small id="alive">生存 6 / 6</small></div>
      <div class="players" id="players"></div>
      <div class="legend">
        <span><b>村陣営</b> 占い師・騎士・村人×2</span>
        <span><b>人狼陣営</b> 人狼・狂人</span>
      </div>
    </section>

    <section class="panel plaza">
      <div class="panel-head"><h2>広場</h2><small id="count">発言 0 / 18</small></div>
      <div class="log" id="log" aria-live="polite"></div>
    </section>
  </div>
</div>

<div class="banner" id="banner" role="dialog" aria-label="勝敗">
  <div class="banner-card">
    <div class="kicker">GAME SET</div>
    <h2>村陣営の勝利</h2>
    <p>秘密投票で人狼のソラを処刑しました</p>
    <div class="stats">
      <div><b>3</b><span>議論の周回</span></div>
      <div><b>18</b><span>発言数</span></div>
      <div><b>4:2</b><span>開票結果</span></div>
    </div>
    <div class="reveal" id="reveal"></div>
    <div style="display:flex;gap:8px;justify-content:center"><button class="btn" id="close">ログを見る</button><button class="btn primary" id="again">↺ もう一度見る</button></div>
  </div>
</div>

<script>
const PLAYERS = [
  {id:"aoi",   name:"アオイ", color:"#3f7fbf", role:"村人",   side:"v"},
  {id:"haru",  name:"ハル",   color:"#4c9a6a", role:"村人",   side:"v"},
  {id:"minato",name:"ミナト", color:"#8a5cc2", role:"占い師", side:"v"},
  {id:"sora",  name:"ソラ",   color:"#c7663a", role:"人狼",   side:"w"},
  {id:"rin",   name:"リン",   color:"#c24f86", role:"狂人",   side:"w"},
  {id:"kai",   name:"カイ",   color:"#2f8f8f", role:"騎士",   side:"v"},
];
const P = Object.fromEntries(PLAYERS.map(p=>[p.id,p]));
const STEPS = ["夜0 · 占い","議論 1","議論 2","議論 3","秘密投票","開票","決着"];

// 台本：実際のゲームでは対戦ログ(JSON)から生成する想定
const W = t=>`<span class="result w">● ${t}</span>`, H = t=>`<span class="result h">○ ${t}</span>`;
const SCRIPT = [
  {step:0, sys:"🌙 夜0：占い師が1人を占いました", night:true},
  {step:1, sys:"☀️ 1日目の朝。全員が生存しています"},
  {step:1, round:"議論 1周目"},
  {step:1, who:"aoi",   text:"おはようございます。まずは占い師の方、名乗り出てもらえますか？"},
  {step:1, who:"minato",text:`占い師です。ソラさんを占って ${W("人狼")} でした。`, claim:true},
  {step:1, who:"sora",  text:"えっ、僕は村人です。ミナトさんが偽物だと思います。"},
  {step:1, who:"rin",   text:`占い師は私です。ハルさんを占って ${H("人間")} でした。`, claim:true},
  {step:1, who:"haru",  text:"占い師が二人……どちらかは偽物ですね。"},
  {step:1, who:"kai",   text:"お二人とも、なぜその人を占ったのか理由を教えてください。"},
  {step:2, round:"議論 2周目"},
  {step:2, who:"minato",text:"ソラさんは開始時の情報が一番少なく、白黒をはっきりさせたかったからです。"},
  {step:2, who:"rin",   text:"ハルさんを白で確定させて、進行役を任せたかったからです。"},
  {step:2, who:"sora",  text:"ミナトさんは僕を黒と言って、自分への疑いをそらしていませんか？"},
  {step:2, who:"aoi",   text:"リンさんの理由は後付けに聞こえます。白判定だけでは村に入る情報が少ないです。"},
  {step:2, who:"haru",  text:"白と言ってもらえたのはありがたいですが、それだけでリンさんは信用できません。"},
  {step:2, who:"kai",   text:"黒を出して対立を作るのは、偽物にはリスクが大きい行動です。"},
  {step:3, round:"議論 3周目"},
  {step:3, who:"rin",   text:"ミナトさんが偽物なら、ソラさんは濡れ衣です。慎重に決めましょう。"},
  {step:3, who:"minato",text:"今日ソラさんを処刑すれば、私が本物かどうかははっきりします。"},
  {step:3, who:"sora",  text:"僕を処刑しても何も出ません。リンさんを信じてください。"},
  {step:3, who:"aoi",   text:"ソラさんがリンさんを推すのは、仲間をかばっているように見えます。"},
  {step:3, who:"haru",  text:"ソラさんに投票します。"},
  {step:3, who:"kai",   text:"僕もソラさんに。ミナトさんの理由のほうが筋が通っています。"},
  {step:4, sys:"🗳️ 秘密投票：全員が同時に1票を投じます"},
  {step:4, vote:["aoi","haru","minato","sora","rin","kai"]},
  {step:5, tally:{aoi:"sora",haru:"sora",minato:"sora",kai:"sora",sora:"minato",rin:"minato"}},
  {step:5, exec:"sora"},
  {step:6, sys:"🏆 人狼がいなくなりました。村陣営の勝利です"},
  {step:6, win:true},
];

const $ = s=>document.querySelector(s);
const logEl = $("#log"), playersEl = $("#players"), stepperEl = $("#stepper");
let i = 0, timer = null, playing = true, speed = 1, said = 0;

function renderPlayers(){
  playersEl.innerHTML = PLAYERS.map(p=>`
    <div class="card" id="c-${p.id}" style="--pc:${p.color}">
      <div class="avatar">${p.name[0]}</div>
      <div class="meta">
        <div class="name">${p.name}</div>
        <div class="sub" id="s-${p.id}"><span class="tag role ${p.side==="w"?"role-w":"role-v"}">${p.role}</span></div>
      </div>
      <div class="votes-in" id="v-${p.id}"></div>
    </div>`).join("");
}
function renderStepper(cur){
  stepperEl.innerHTML = STEPS.map((s,k)=>`<div class="step ${k<cur?"done":""} ${k===cur?"now":""} ${k===cur&&k===0?"night":""}">${s}</div>`).join("");
  const now = stepperEl.querySelector(".now"); now && now.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
}
function addTag(id,cls,text){
  const s = $("#s-"+id); if(s.querySelector("."+cls)) return;
  s.insertAdjacentHTML("beforeend",`<span class="tag ${cls}">${text}</span>`);
}
function push(html){ logEl.insertAdjacentHTML("beforeend",html); logEl.scrollTop = logEl.scrollHeight; }

function run(ev){
  renderStepper(ev.step);
  document.querySelectorAll(".card.speaking").forEach(c=>c.classList.remove("speaking"));
  if(ev.sys)   push(`<div class="sys ${ev.night?"night":""}">${ev.sys}</div>`);
  if(ev.round) push(`<div class="round">${ev.round}</div>`);
  if(ev.who){
    const p = P[ev.who]; said++;
    $("#count").textContent = `発言 ${said} / 18`;
    $("#c-"+p.id).classList.add("speaking");
    if(ev.claim) addTag(p.id,"claim","占い師CO");
    push(`<div class="msg" style="--pc:${p.color}"><div class="avatar">${p.name[0]}</div>
      <div class="bubble"><div class="who">${p.name}${ev.claim?'<span class="tag claim">占い師CO</span>':""}</div><p>${ev.text}</p></div></div>`);
  }
  if(ev.vote) ev.vote.forEach(id=>addTag(id,"voted","投票済 ✓"));
  if(ev.tally){
    const n = {}; Object.values(ev.tally).forEach(t=>n[t]=(n[t]||0)+1);
    const rows = Object.entries(n).sort((a,b)=>b[1]-a[1]);
    push(`<div class="tally"><h3>開票結果</h3>
      ${rows.map(([t,c],k)=>`<div class="tally-row ${k?"low":""}"><span>${P[t].name}</span><div class="bar"><i data-w="${c/6*100}"></i></div><b>${c}</b></div>`).join("")}
      <div class="arrows">${Object.entries(ev.tally).map(([f,t])=>`<span class="arrow">${P[f].name} → ${P[t].name}</span>`).join("")}</div></div>`);
    requestAnimationFrame(()=>requestAnimationFrame(()=>logEl.querySelectorAll(".bar i").forEach(b=>b.style.width=b.dataset.w+"%")));
    rows.forEach(([t,c])=>{const v=$("#v-"+t); v.textContent=c; v.classList.add("on");});
  }
  if(ev.exec){
    const p = P[ev.exec];
    $("#c-"+p.id).classList.add("dead"); addTag(p.id,"exec","処刑");
    $("#alive").textContent = "生存 5 / 6";
    push(`<div class="sys">⚖️ ${p.name}が処刑されました。正体は <span class="result w">● ${p.role}</span></div>`);
  }
  if(ev.win){
    $("#reveal").innerHTML = PLAYERS.map(p=>`<span class="tag ${p.side==="w"?"role-w":"role-v"}">${p.name}：${p.role}</span>`).join("");
    $("#banner").classList.add("on");
  }
}
function delay(ev){ return (ev.who ? 1700 + ev.text.length*28 : ev.tally ? 2600 : 1100) / speed; }
function tick(){
  if(!playing || i>=SCRIPT.length) return;
  const ev = SCRIPT[i++]; run(ev);
  timer = setTimeout(tick, delay(ev));
}
function restart(){
  clearTimeout(timer); i=0; said=0;
  logEl.innerHTML=""; $("#banner").classList.remove("on");
  $("#alive").textContent="生存 6 / 6"; $("#count").textContent="発言 0 / 18";
  renderPlayers(); renderStepper(0);
  playing=true; $("#play").textContent="⏸ 一時停止"; tick();
}
function togglePlay(){
  playing=!playing; $("#play").textContent = playing?"⏸ 一時停止":"▶ 再生";
  clearTimeout(timer); if(playing) tick();
}
$("#play").onclick = togglePlay;
$("#restart").onclick = restart;
$("#again").onclick = restart;
$("#close").onclick = ()=>$("#banner").classList.remove("on");
$("#speed").onclick = ()=>{ speed = speed===1?2:speed===2?4:1; $("#speed").textContent=`速度 ${speed}×`; };
$("#roles").onclick = e=>{ const on=document.body.classList.toggle("show-roles"); e.currentTarget.setAttribute("aria-pressed",on); };
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();togglePlay();}
  if(e.key==="r"||e.key==="R") restart();
  if(e.key==="h"||e.key==="H") $("#roles").click();
});
restart();
</script>
</body>
</html>

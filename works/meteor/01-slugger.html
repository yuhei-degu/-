<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作戦：全力ホームラン</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H, u, gy;
function rs() { W = c.width = innerWidth; H = c.height = innerHeight; u = Math.min(W, H) / 100; gy = H * 0.82; }
rs(); addEventListener('resize', rs);
const t0 = performance.now();
const T_OVERRIDE = Number(new URLSearchParams(location.search).get('at'));
const stars = Array.from({ length: 160 }, () => [Math.random(), Math.random() * 0.75, Math.random() * 1.4 + 0.3]);
const lerp = (a, b, k) => a + (b - a) * k, cl = (v) => Math.max(0, Math.min(1, v));
const easeIn = (k) => k * k, easeOut = (k) => 1 - (1 - k) * (1 - k);

function bg(t, flash = 0, ground = '#1d2b1f') {
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#050818'); g.addColorStop(1, '#2b1d3d');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = '#fff';
  for (const [a, b, r] of stars) { x.globalAlpha = 0.45 + 0.45 * Math.sin(t * 3 + a * 60); x.fillRect(a * W, b * H, r, r); }
  x.globalAlpha = 1;
  x.fillStyle = ground; x.fillRect(0, gy, W, H - gy);
  x.fillStyle = 'rgba(255,255,255,.06)'; x.fillRect(0, gy, W, 0.5 * u);
  if (flash > 0) { x.fillStyle = `rgba(255,255,255,${flash})`; x.fillRect(0, 0, W, H); }
}

function label(s, y, size, col = '#fff') {
  x.font = `900 ${size * u}px system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif`;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineJoin = 'round'; x.lineWidth = size * u / 4; x.strokeStyle = '#000'; x.strokeText(s, W / 2, y);
  x.fillStyle = col; x.fillText(s, W / 2, y);
}

function title(s) { label(s, 7 * u, 5.5, '#ffd24a'); }

function pop(s, px, py, size, col, age) {
  const k = cl(age / 0.25), sc = 0.5 + 0.5 * easeOut(k) + 0.1 * Math.sin(age * 20) * Math.max(0, 1 - age);
  x.save(); x.translate(px, py); x.scale(sc, sc);
  x.font = `900 ${size * u}px system-ui, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = size * u / 4; x.strokeStyle = '#000'; x.strokeText(s, 0, 0); x.fillStyle = col; x.fillText(s, 0, 0);
  x.restore();
}

// 棒人間。arms: [[shoulder->hand 角度, 長さ], ...]
function body(hx, squat = 0) {
  const hy = gy, k = squat * 4 * u;
  x.strokeStyle = '#fff'; x.lineWidth = 1.3 * u; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath(); x.arc(hx, hy - 26 * u + k, 4 * u, 0, 7); x.stroke();
  x.beginPath(); x.moveTo(hx, hy - 22 * u + k); x.lineTo(hx, hy - 10 * u + k);
  x.lineTo(hx - 4 * u - squat * 2 * u, hy - 5 * u + k / 2); x.lineTo(hx - 4 * u, hy);
  x.moveTo(hx, hy - 10 * u + k); x.lineTo(hx + 4 * u + squat * 2 * u, hy - 5 * u + k / 2); x.lineTo(hx + 4 * u, hy);
  x.stroke();
  return { sx: hx, sy: hy - 19 * u + k, headY: hy - 26 * u + k };
}
function arm(sx, sy, ex, ey) { x.strokeStyle = '#fff'; x.lineWidth = 1.3 * u; x.beginPath(); x.moveTo(sx, sy); x.lineTo(ex, ey); x.stroke(); }

function meteor(mx, my, r, vx, vy, fire = 1, rock = [107, 80, 64]) {
  if (fire > 0) {
    const L = Math.hypot(vx, vy) || 1, tx = -vx / L, ty = -vy / L;
    for (let i = 14; i > 0; i--) {
      x.fillStyle = `rgba(255,${100 + i * 9},40,${0.07 * fire})`;
      x.beginPath(); x.arc(mx + tx * r * i * 0.55, my + ty * r * i * 0.55, r * (1 + i * 0.07), 0, 7); x.fill();
    }
    x.fillStyle = `rgba(255,170,60,${0.35 * fire})`; x.beginPath(); x.arc(mx, my, r * 1.45, 0, 7); x.fill();
  }
  x.fillStyle = `rgb(${rock})`; x.beginPath(); x.arc(mx, my, r, 0, 7); x.fill();
  x.fillStyle = 'rgba(0,0,0,.28)';
  for (const [a, b, s] of [[-0.35, -0.2, 0.26], [0.38, 0.12, 0.19], [-0.08, 0.45, 0.15], [0.2, -0.5, 0.12]]) {
    x.beginPath(); x.arc(mx + a * r, my + b * r, s * r, 0, 7); x.fill();
  }
  if (fire > 0) { x.fillStyle = `rgba(255,120,30,${0.35 * fire})`; x.beginPath(); x.arc(mx, my, r, 0, 7); x.fill(); }
}

function rng(seed) { return () => ((seed = (seed * 16807) % 2147483647) / 2147483647); }

function loop(len, draw) {
  function frame(now) {
    const t = T_OVERRIDE >= 0 && new URLSearchParams(location.search).has('at') ? T_OVERRIDE : ((now - t0) / 1000) % len;
    if (c.width !== innerWidth || c.height !== innerHeight) rs();
    x.save(); draw(t); x.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// 人格：熱血スラッガー — 全力ホームラン
loop(20, (t) => {
  const hx = W * 0.42, cx = hx + 17 * u, cy = gy - 34 * u, sx0 = W + 25 * u, sy0 = -25 * u;
  const shake = t > 9 && t < 9.7 ? (1 - (t - 9) / 0.7) * 2 * u : 0;
  x.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  bg(t, t > 9 ? Math.max(0, 0.9 - (t - 9) * 2.5) : 0);
  title('作戦：全力ホームラン');

  let swing = t < 8.4 ? 0.05 * Math.sin(t * 4) : cl((t - 8.4) / 0.6);
  const p = body(hx, t > 8.2 && t < 9.4 ? 0.4 : 0);
  const a = lerp(-2.7, -0.55, easeIn(swing));
  const hand = [p.sx + 6 * u * Math.cos(a + 0.5), p.sy + 6 * u * Math.sin(a + 0.5)];
  arm(p.sx, p.sy, ...hand);
  x.strokeStyle = '#d19a55'; x.lineWidth = 2.4 * u; x.lineCap = 'round';
  x.beginPath(); x.moveTo(...hand); x.lineTo(hand[0] + 18 * u * Math.cos(a), hand[1] + 18 * u * Math.sin(a)); x.stroke();

  if (t < 9) {
    const k = easeIn(t / 9);
    meteor(lerp(sx0, cx, k), lerp(sy0, cy, k), lerp(4, 11, k) * u, cx - sx0, cy - sy0, 1);
    if (t > 6) pop('でかい！', W * 0.25, gy - 45 * u, 5, '#fff', t - 6);
  } else if (t < 13) {
    const k = easeOut(cl((t - 9) / 3.2));
    const mx = lerp(cx, W * 0.86, k), my = lerp(cy, H * 0.12, k);
    meteor(mx, my, lerp(11, 0.6, k) * u, W * 0.86 - cx, H * 0.12 - cy, 1 - k * 0.5);
    pop('カキーン！！', cx + 6 * u, cy - 14 * u, 8, '#ffe14d', t - 9);
  }
  if (t >= 12) {
    const s = (1 + 0.4 * Math.sin(t * 8)) * 2.5 * u, sx = W * 0.86, sy = H * 0.12;
    x.strokeStyle = '#fff6b0'; x.lineWidth = 0.6 * u;
    x.beginPath(); x.moveTo(sx - s, sy); x.lineTo(sx + s, sy); x.moveTo(sx, sy - s); x.lineTo(sx, sy + s); x.stroke();
  }
  if (t >= 12.5) pop('ホームラン！', W / 2, H * 0.2, 9, '#fff', t - 12.5);
  if (t >= 14.2) pop('無傷！', W / 2, H * 0.36, 11, '#5dff8a', t - 14.2);
});
</script>
</body>
</html>

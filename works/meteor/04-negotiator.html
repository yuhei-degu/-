<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作戦：説得する</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H, u, gy;
function rs() { W = c.width = innerWidth; H = c.height = innerHeight; u = Math.min(W, H) / 100; gy = H * 0.82; }
rs(); addEventListener('resize', rs);
const t0 = performance.now();
const T_OVERRIDE = Number(new URLSearchParams(location.search).get('at'));
const stars = Array.from({ length: 160 }, () => [Math.random(), Math.random() * 0.75, Math.random() * 1.4 + 0.3]);
const lerp = (a, b, k) => a + (b - a) * k, cl = (v) => Math.max(0, Math.min(1, v));
const easeIn = (k) => k * k, easeOut = (k) => 1 - (1 - k) * (1 - k);

function bg(t, flash = 0, ground = '#1d2b1f') {
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#050818'); g.addColorStop(1, '#2b1d3d');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = '#fff';
  for (const [a, b, r] of stars) { x.globalAlpha = 0.45 + 0.45 * Math.sin(t * 3 + a * 60); x.fillRect(a * W, b * H, r, r); }
  x.globalAlpha = 1;
  x.fillStyle = ground; x.fillRect(0, gy, W, H - gy);
  x.fillStyle = 'rgba(255,255,255,.06)'; x.fillRect(0, gy, W, 0.5 * u);
  if (flash > 0) { x.fillStyle = `rgba(255,255,255,${flash})`; x.fillRect(0, 0, W, H); }
}

function label(s, y, size, col = '#fff') {
  x.font = `900 ${size * u}px system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif`;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineJoin = 'round'; x.lineWidth = size * u / 4; x.strokeStyle = '#000'; x.strokeText(s, W / 2, y);
  x.fillStyle = col; x.fillText(s, W / 2, y);
}

function title(s) { label(s, 7 * u, 5.5, '#ffd24a'); }

function pop(s, px, py, size, col, age) {
  const k = cl(age / 0.25), sc = 0.5 + 0.5 * easeOut(k) + 0.1 * Math.sin(age * 20) * Math.max(0, 1 - age);
  x.save(); x.translate(px, py); x.scale(sc, sc);
  x.font = `900 ${size * u}px system-ui, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = size * u / 4; x.strokeStyle = '#000'; x.strokeText(s, 0, 0); x.fillStyle = col; x.fillText(s, 0, 0);
  x.restore();
}

// 棒人間。arms: [[shoulder->hand 角度, 長さ], ...]
function body(hx, squat = 0) {
  const hy = gy, k = squat * 4 * u;
  x.strokeStyle = '#fff'; x.lineWidth = 1.3 * u; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath(); x.arc(hx, hy - 26 * u + k, 4 * u, 0, 7); x.stroke();
  x.beginPath(); x.moveTo(hx, hy - 22 * u + k); x.lineTo(hx, hy - 10 * u + k);
  x.lineTo(hx - 4 * u - squat * 2 * u, hy - 5 * u + k / 2); x.lineTo(hx - 4 * u, hy);
  x.moveTo(hx, hy - 10 * u + k); x.lineTo(hx + 4 * u + squat * 2 * u, hy - 5 * u + k / 2); x.lineTo(hx + 4 * u, hy);
  x.stroke();
  return { sx: hx, sy: hy - 19 * u + k, headY: hy - 26 * u + k };
}
function arm(sx, sy, ex, ey) { x.strokeStyle = '#fff'; x.lineWidth = 1.3 * u; x.beginPath(); x.moveTo(sx, sy); x.lineTo(ex, ey); x.stroke(); }

function meteor(mx, my, r, vx, vy, fire = 1, rock = [107, 80, 64]) {
  if (fire > 0) {
    const L = Math.hypot(vx, vy) || 1, tx = -vx / L, ty = -vy / L;
    for (let i = 14; i > 0; i--) {
      x.fillStyle = `rgba(255,${100 + i * 9},40,${0.07 * fire})`;
      x.beginPath(); x.arc(mx + tx * r * i * 0.55, my + ty * r * i * 0.55, r * (1 + i * 0.07), 0, 7); x.fill();
    }
    x.fillStyle = `rgba(255,170,60,${0.35 * fire})`; x.beginPath(); x.arc(mx, my, r * 1.45, 0, 7); x.fill();
  }
  x.fillStyle = `rgb(${rock})`; x.beginPath(); x.arc(mx, my, r, 0, 7); x.fill();
  x.fillStyle = 'rgba(0,0,0,.28)';
  for (const [a, b, s] of [[-0.35, -0.2, 0.26], [0.38, 0.12, 0.19], [-0.08, 0.45, 0.15], [0.2, -0.5, 0.12]]) {
    x.beginPath(); x.arc(mx + a * r, my + b * r, s * r, 0, 7); x.fill();
  }
  if (fire > 0) { x.fillStyle = `rgba(255,120,30,${0.35 * fire})`; x.beginPath(); x.arc(mx, my, r, 0, 7); x.fill(); }
}

function rng(seed) { return () => ((seed = (seed * 16807) % 2147483647) / 2147483647); }

function loop(len, draw) {
  function frame(now) {
    const t = T_OVERRIDE >= 0 && new URLSearchParams(location.search).has('at') ? T_OVERRIDE : ((now - t0) / 1000) % len;
    if (c.width !== innerWidth || c.height !== innerHeight) rs();
    x.save(); draw(t); x.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// 人格：おしゃべりな交渉人 — 隕石を説得する
function bubble(s, bx, by, tx, ty, col = '#fff') {
  x.font = `700 ${4 * u}px system-ui, "Hiragino Sans", sans-serif`;
  const w = x.measureText(s).width + 5 * u, h = 8 * u;
  x.fillStyle = col; x.strokeStyle = '#000'; x.lineWidth = 0.5 * u;
  x.beginPath(); x.roundRect(bx - w / 2, by - h / 2, w, h, 3 * u); x.fill(); x.stroke();
  x.beginPath(); x.moveTo(bx - 2 * u, by + h / 2 - 0.3 * u); x.lineTo(tx, ty); x.lineTo(bx + 2 * u, by + h / 2 - 0.3 * u); x.fill();
  x.fillStyle = '#111'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(s, bx, by);
}
function face(mx, my, r, mood, t) { // mood: 0=怒り 1=動揺 2=笑顔
  x.fillStyle = '#fff';
  for (const d of [-1, 1]) { x.beginPath(); x.arc(mx + d * r * 0.33, my - r * 0.1, r * 0.17, 0, 7); x.fill(); }
  x.fillStyle = '#000';
  for (const d of [-1, 1]) { x.beginPath(); x.arc(mx + d * r * 0.33 + (mood === 1 ? Math.sin(t * 9) * r * 0.05 : 0), my - r * 0.08, r * 0.08, 0, 7); x.fill(); }
  x.strokeStyle = '#000'; x.lineWidth = r * 0.07; x.lineCap = 'round';
  if (mood === 0) for (const d of [-1, 1]) { x.beginPath(); x.moveTo(mx + d * r * 0.5, my - r * 0.42); x.lineTo(mx + d * r * 0.15, my - r * 0.28); x.stroke(); }
  x.beginPath();
  if (mood === 2) x.arc(mx, my + r * 0.2, r * 0.28, 0.2, Math.PI - 0.2);
  else if (mood === 1) { x.moveTo(mx - r * 0.2, my + r * 0.4); x.quadraticCurveTo(mx, my + r * 0.3, mx + r * 0.2, my + r * 0.4); }
  else { x.moveTo(mx - r * 0.25, my + r * 0.42); x.quadraticCurveTo(mx, my + r * 0.2, mx + r * 0.25, my + r * 0.42); }
  x.stroke();
  if (mood >= 1) { x.fillStyle = 'rgba(255,110,140,.5)'; for (const d of [-1, 1]) { x.beginPath(); x.arc(mx + d * r * 0.55, my + r * 0.15, r * 0.13, 0, 7); x.fill(); } }
  if (mood === 1) { x.fillStyle = '#7fd4ff'; x.beginPath(); x.arc(mx + r * 0.75, my - r * 0.45 + ((t * 2) % 1) * r * 0.4, r * 0.08, 0, 7); x.fill(); }
}
loop(22, (t) => {
  const hx = W * 0.38;
  bg(t);
  title('作戦：説得する');
  const p = body(hx);
  const wave = Math.sin(t * 6) * 0.3;
  arm(p.sx, p.sy, hx + 7 * u * Math.cos(-0.9 + wave), p.sy + 7 * u * Math.sin(-0.9 + wave));
  arm(p.sx, p.sy, hx - 6 * u, p.sy + 5 * u);

  // 12秒かけて減速し、頭上で停止。16秒以降は空へ帰って月になる
  const k = easeOut(cl(t / 12));
  let mx = lerp(W * 0.95, W * 0.6, k), my = lerp(-25 * u, gy - 47 * u, k), r = lerp(6, 13, k) * u;
  if (t > 16) { const s = easeOut(cl((t - 16) / 3)); mx = lerp(mx, W * 0.85, s); my = lerp(my, H * 0.18, s); r = lerp(r, 6 * u, s); }
  const fire = 1 - cl((t - 8) / 4), mood = t < 8 ? 0 : t < 12.5 ? 1 : 2;
  if (t > 16) { x.fillStyle = 'rgba(255,240,170,.18)'; x.beginPath(); x.arc(mx, my, r * 1.8, 0, 7); x.fill(); }
  meteor(mx, my, r, W * 0.6 - W * 0.95, gy, fire, t > 16 ? [230, 220, 170] : [107, 80, 64]);
  face(mx, my, r, mood, t);

  const bx = hx + 6 * u, by = gy - 40 * u;
  if (t > 2.5 && t < 6) bubble('ちょ、ちょっと待って！', bx, by, hx + 3 * u, p.headY - 4 * u);
  if (t > 6.3 && t < 10) bubble('ぶつかったら君も砕けちゃうよ？', bx, by, hx + 3 * u, p.headY - 4 * u);
  if (t > 10.2 && t < 12.8) bubble('…たしかに', mx, my - r - 7 * u, mx, my - r, '#ffe9b0');
  if (t > 13 && t < 16) bubble('ごめん、帰るね', mx, my - r - 7 * u, mx, my - r, '#ffe9b0');
  if (t > 14 && t < 16.5) bubble('いいってことよ', bx - 18 * u, by + 4 * u, hx - 2 * u, p.headY - 4 * u);
  if (t > 17.5) pop('無傷！', W / 2, H * 0.36, 11, '#5dff8a', t - 17.5);
  if (t > 18.6) pop('（友達もできた）', W / 2, H * 0.49, 4.5, '#fff', t - 18.6);
});
</script>
</body>
</html>
